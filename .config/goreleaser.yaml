version: 2
project_name: athenaeum
before:
  hooks:
    - go mod tidy
release:
  mode: keep-existing
builds:
  - main: ./cmd/athenaeum
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.Date={{.Date}}
changelog:
  use: github-native
homebrew_casks:
  - repository:
      owner: CallumKerson
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/CallumKerson/Athenaeum"
    license: "MIT"
    caveats: |
      ****************************************************************
      Athenaeum generates a static site. Run `athenaeum build` to
      regenerate it, and serve the output directory with a web server.
      Configuration lives at ~/.config/athenaeum/athenaeum.toml
      ****************************************************************
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/athenaeum"]
          end
